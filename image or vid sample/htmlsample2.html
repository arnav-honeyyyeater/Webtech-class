<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Space · Deadline Disco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #faf8f5;
      --card-surface: #ffffff;
      --border-subtle: #eee7de;
      --text-main: #2b2825;
      --text-muted: #877f76;
      --accent-coral: #ff6b6b;
      --accent-peach: #ffe5dd;
      --accent-pink: #fce7f3;
      --accent-yellow: #fef08a;
      --accent-mint: #dcfce7;
      --shadow-sm: 0 4px 12px rgba(92, 77, 66, 0.05);
      --shadow-md: 0 12px 32px -4px rgba(92, 77, 66, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#e5dfd5 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Cute Status Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 10px 22px;
      box-shadow: var(--shadow-sm);
    }

    .brand-tag {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #059669;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      border: 1px solid #a7f3d0;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    /* Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
    }

    .bento-card {
      background: var(--card-surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    }

    .bento-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px -4px rgba(92, 77, 66, 0.12);
    }

    /* Video Hero Tile */
    .video-card {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mac-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-red { background: #fca5a5; }
    .dot-yellow { background: #fde047; }
    .dot-green { background: #86efac; }

    .music-badge {
      background: var(--accent-peach);
      color: var(--accent-coral);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
    }

    .video-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.3;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #111;
      border: 1.5px solid #2e2b27;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: none;
    }

    /* Aura Chat Tile */
    .aura-card {
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #fffcf8 100%);
    }

    .card-header-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.45;
      max-width: 90%;
      box-shadow: var(--shadow-sm);
    }

    .bubble-left {
      background: #f7f4ef;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      color: #443e38;
      border: 1px solid #ebd9c8;
    }

    #para1.bubble {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #ffffff;
      font-weight: 700;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 16px rgba(255, 117, 140, 0.35);
      border: none;
      font-size: 1rem;
    }

    .bubble-reply {
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      color: #9d174d;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* Polaroid Image Tile */
    .image-card {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
      background: #fffdfa;
    }

    .washi-tape {
      position: absolute;
      top: -10px;
      width: 90px;
      height: 24px;
      background: rgba(254, 240, 138, 0.75);
      border: 1px dashed rgba(202, 138, 4, 0.4);
      transform: rotate(-3deg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      z-index: 2;
    }

    .polaroid {
      background: #ffffff;
      padding: 12px 12px 18px 12px;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(92, 77, 66, 0.12);
      border: 1.5px solid var(--border-subtle);
      width: 100%;
      max-width: 250px;
      transform: rotate(1.5deg);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.03);
    }

    .polaroid-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #f4f0eb;
    }

    .polaroid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.25rem;
      color: #554d45;
      margin-top: 10px;
      text-align: center;
    }

    /* Bottom Pill Ticker */
    .bottom-ticker {
      display: flex;
      justify-content: space-around;
      background: var(--card-surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      box-shadow: var(--shadow-sm);
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ticker-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ticker-highlight {
      color: var(--accent-coral);
    }

    /* Responsive adjustments */
    @media (max-width: 820px) {
      .bento-grid {
        grid-template-columns: 1fr;
      }
      .video-card, .aura-card, .image-card {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Navigation Pill -->
    <header class="top-bar">
      <div class="brand-tag">
        <span>✨</span> my cute corner · local feed
      </div>
      <div class="status-pill">
        <span class="pulse-dot"></span>
        deadline mode active

    </header>

    <!-- Bento Showcase -->
    <main class="bento-grid">
      
      <!-- Video Hero -->
      <section class="bento-card video-card">

            <span class="dot dot-red"></span>

        <h1 class="video-title">Deadline disco ₍₍ ◝(・ω・)◟ ⁾⁾ 🥹✨</h1>
        
        <div class="video-wrapper">
          <video controls>
            <source src="C:\Users\honey\OneDrive\Desktop\Lynae's Deadline Disco ⁽⁽ 〪ɾ( ˘ω˘ 〫ɩ ) ₎.mp4" type="video/mp4">

      <section class="bento-card aura-card">

      <section class="bento-card image-card">

    </main>

    <!-- Aesthetic Footer Ticker -->
    <footer class="bottom-ticker">
      <div class="ticker-item"><span>🌸</span> Vibe: <span class="ticker-highlight">Peak Aura</span></div>
      <div class="ticker-item"><span>☕</span> Status: <span class="ticker-highlight">Beating the Deadline</span></div>
      <div class="ticker-item"><span>⭐</span> Quality: <span class="ticker-highlight">100% Handcrafted</span></div>
    </footer>

  </div>

</body>
</html>
