<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Layout</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container {
            display: flex; /* Parent container becomes flex */
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .box { border: 2px solid black; padding: 20px; background-color: lightblue; }
        
        /* Media query for mobile viewports */
        @media (max-width: 768px) {
            .container { flex-direction: column; } /* Stacks items vertically */
        }
    </style>
</head>
<body>
    <h1>My Flexbox Profile</h1>
    <p>This layout uses Flexbox and Media Queries.</p>
    <a href="https://google.com" target="_blank">Visit Google</a>
    <br><br>
    <img src="profile.jpg" alt="My profile picture" width="150">
    
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
    </div>
</body>
</html>
