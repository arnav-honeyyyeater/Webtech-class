<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Grid Layout</h1>

    <p>
        A Grid Layout must have a parent element with the
        <em>display</em> property set to <em>grid</em> or <em>inline-grid</em>.
    </p>

    <p>
        Direct child element(s) of the grid container automatically
        becomes grid items.
    </p>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>

</body>
</html>
